# Builds, checks the formatting and runs the tests on Linux and Windows, then checks the plugin as the hub does when it publishes a release.
name: CI

on:
  pull_request:
  push:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test on ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            runner: ubuntu-24.04
          - system: Windows
            runner: windows-2025
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build plugin-java.slnx -warnaserror

      - name: Check the formatting
        run: dotnet format plugin-java.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution plugin-java.slnx --no-build -- --hangdump --hangdump-timeout 10m --hangdump-type Mini

  hub-check:
    name: Hub check
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # Outside the checkout, whose package source mapping rejects --add-source.
      - name: Install the hub tool
        working-directory: ${{ runner.temp }}
        run: dotnet tool install RunesmithHub.Tool --version 0.1.2 --add-source https://nuget.runesmith.dev/index.json --tool-path "$RUNNER_TEMP/rshub"

      - name: Check the plugin
        run: |
          "$RUNNER_TEMP/rshub/rshub" check .
